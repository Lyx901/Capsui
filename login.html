<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCU Bell System Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Inline error messages for inputs */
    .input-group .message {
      display:block;
      color:#ef233c;
      font-size:14px;
      margin-top:6px;
      text-align:left;
    }
    .input-group.has-error input {
      border-color:#ef233c;
    }
    .input-group.has-error .password-field input {
      border-color:#ef233c;
    }
    .message.success {
      color:#166534;
    }
  </style>
</head>
<body>
  <section class="login-page" id="login-page">
    <div class="background"></div>
    <div class="login-container">
      <div class="logo-section">
        <img src="FCU.jpg" alt="Logo" />
      </div>
      <div class="portal-title">
        FCU ELEMENTARY
        <center>SCHOOL BELL SYSTEM</center>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form">
        <div class="input-group" id="login-username-group">
          <input type="text" id="login-username" placeholder="Username" required />
          <div class="message" id="login-username-message"></div>
        </div>
        <div class="input-group" id="login-password-group">
          <div class="password-field">
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="button" class="password-toggle" data-password-target="login-password" aria-label="Show password">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
          <div class="message" id="login-password-message"></div>
        </div>
        <div class="captcha-text">Protected by reCAPTCHA v3</div>
        <button type="submit" class="login-btn">SIGN IN</button>
      </form>

     <!-- REGISTER FORM -->
<form id="register-form" hidden>
  <div class="input-group" id="register-username-group">
    <input type="text" id="register-username" placeholder="Choose a username" required />
    <div class="message" id="register-username-message"></div>
  </div>

  <div class="input-group" id="register-password-group">
    <div class="password-field">
      <input type="password" id="register-password" placeholder="Create a password" required />
      <button type="button" class="password-toggle" data-password-target="register-password" aria-label="Show password">
        <i class="fa-solid fa-eye-slash"></i>
      </button>
    </div>
    <div class="message" id="register-password-message"></div>
  </div>

  <div class="input-group" id="register-password-confirm-group">
    <div class="password-field">
      <input type="password" id="register-password-confirm" placeholder="Confirm password" required />
      <button type="button" class="password-toggle" data-password-target="register-password-confirm" aria-label="Show password">
        <i class="fa-solid fa-eye-slash"></i>
      </button>
    </div>
    <div class="message" id="register-password-confirm-message"></div>
  </div>

  <button type="submit" class="login-btn">CREATE ACCOUNT</button>
</form>


      <div class="footer-text">
        <span id="account-prompt">Don't have an account yet? <button type="button" id="show-register">Sign Up</button></span>
        <span id="login-prompt" hidden>Already have an account? <button type="button" id="show-login">Sign in</button></span>
      </div>
    </div>
  </section>

  <script>
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const accountsStorageKey = "fcuBellAccounts";

    // Error message elements
    const loginUsernameMessage = document.getElementById("login-username-message");
    const loginPasswordMessage = document.getElementById("login-password-message");
    const registerUsernameMessage = document.getElementById("register-username-message");
    const registerPasswordMessage = document.getElementById("register-password-message");
    const registerConfirmMessage = document.getElementById("register-password-confirm-message");

    const readAccounts = () => {
      try {
        const savedAccounts = JSON.parse(localStorage.getItem(accountsStorageKey));
        if (Array.isArray(savedAccounts) && savedAccounts.length) {
          return savedAccounts;
        }
      } catch {}
      return [{ username: "admin", password: "admin123" }];
    };

    // Password toggle
    document.querySelectorAll(".password-toggle").forEach((toggle) => {
      toggle.addEventListener("click", () => {
        const passwordInput = document.getElementById(toggle.dataset.passwordTarget);
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggle.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
        toggle.querySelector("i").className = `fa-solid ${isPassword ? "fa-eye" : "fa-eye-slash"}`;
      });
    });

    // Switch forms
    document.getElementById("show-register").addEventListener("click", () => {
      loginForm.hidden = true;
      registerForm.hidden = false;
      document.getElementById("account-prompt").hidden = true;
      document.getElementById("login-prompt").hidden = false;
      clearMessages();
      document.getElementById("register-username").focus();
    });

    document.getElementById("show-login").addEventListener("click", () => {
      registerForm.hidden = true;
      loginForm.hidden = false;
      document.getElementById("account-prompt").hidden = false;
      document.getElementById("login-prompt").hidden = true;
      clearMessages();
      document.getElementById("login-username").focus();
    });

    function clearMessages() {
      [loginUsernameMessage, loginPasswordMessage, registerUsernameMessage, registerPasswordMessage, registerConfirmMessage].forEach(el => el.textContent = "");
    }

    // LOGIN
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      clearMessages();

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!username) {
        loginUsernameMessage.textContent = "Username is required.";
        return;
      }
      if (!password) {
        loginPasswordMessage.textContent = "Password is required.";
        return;
      }

      const account = readAccounts().find((entry) => entry.username.toLowerCase() === username.toLowerCase());
      if (!account) {
  loginUsernameMessage.textContent = "Invalid username.";
  return;
    }
      if (account.status === "Pending") {
        loginUsernameMessage.textContent = "This account is Pending Review.";
        return;
    }
      if (account.status === "Inactive") {
        loginUsernameMessage.textContent = "This account is not active.";
        return;
    }
      if (account.password !== password) {
        loginPasswordMessage.textContent = "Invalid password.";
        return;
      }

      const accounts = readAccounts().map((entry) => entry.username.toLowerCase() === username.toLowerCase()
        ? { ...entry, lastLogin: new Date().toLocaleString() }
        : entry);
      localStorage.setItem(accountsStorageKey, JSON.stringify(accounts));
      localStorage.setItem("fcuBellLoggedIn", "true");
      localStorage.setItem("fcuBellCurrentUser", JSON.stringify({ username }));
      window.location.href = "index.html";
    });

    // REGISTER
    registerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      clearMessages();

      const username = document.getElementById("register-username").value.trim();
      const password = document.getElementById("register-password").value;
      const confirmation = document.getElementById("register-password-confirm").value;
      const accounts = readAccounts();

      if (accounts.some((entry) => entry.username.toLowerCase() === username.toLowerCase())) {
        registerUsernameMessage.textContent = "That username is already in use.";
        return;
      }
      if (password !== confirmation) {
        registerConfirmMessage.textContent = "Passwords do not match.";
        return;
      }
      if (password.length < 6) {
        registerPasswordMessage.textContent = "Password must be at least 6 characters.";
        return;
      }

      accounts.push({ username, password });
      localStorage.setItem(accountsStorageKey, JSON.stringify(accounts));
      registerForm.reset();
      document.getElementById("show-login").click();
      document.getElementById("login-username").value = username;
      loginUsernameMessage.textContent = "Account created. You can now sign in.";
      loginUsernameMessage.classList.add("success");
    });
  </script>
</body>
</html>

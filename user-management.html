<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management | FCU Bell System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="dashboard-page" style="display:flex;">
    <aside class="sidebar">
      <div>
        <div class="profile-section">
          <img src="pfp.jpg" alt="Profile" />
          <h2>ADMIN</h2>
        </div>

        <nav class="menu">
          <a href="index.html">
            <i class="fa-solid fa-gauge"></i>
            Dashboard
          </a>
          <a href="schedule.html">
            <i class="fa-solid fa-calendar-days"></i>
            Schedule
          </a>
          <a href="user-management.html" class="active">
            <i class="fa-solid fa-person"></i>
            User Management
          </a>
          <a href="activity-logs.html">
            <i class="fa-solid fa-clock"></i>
            Activity Logs
          </a>
          <a href="manual.html">
            <i class="fa-solid fa-hand"></i>
            Manual
          </a>
        </nav>
      </div>

      <div class="logout">
        <a href="index.html">
          <i class="fa-solid fa-right-from-bracket"></i>
          Sign Out
        </a>
      </div>
    </aside>

    <main class="main-content">
      <section class="page-title">
        <h2>User Management</h2>
        <p>Manage staff accounts and access permissions</p>
      </section>

      <section class="cards">
        <div class="card">
          <i class="fa-solid fa-users"></i>
          <h3>Total Users</h3>
          <p id="user-count">0</p>
        </div>
        <div class="card">
          <i class="fa-solid fa-user-shield"></i>
          <h3>Admin Accounts</h3>
          <p id="admin-count">0</p>
        </div>
        <div class="card">
          <i class="fa-solid fa-circle-check"></i>
          <h3>Active Users</h3>
          <p id="active-user-count">0</p>
        </div>
      </section>

      <section class="table-section">
        <div class="section-heading">
          <h2>Account Overview</h2>
          <button type="button" id="add-user">Add User</button>
        </div>
        <form id="user-form" class="schedule-form" hidden>
          <div class="form-row">
            <input type="text" id="user-username" placeholder="Username" autocomplete="off" required />
            <input type="password" id="user-password" placeholder="Password (min. 6 characters)" autocomplete="new-password" />
            <select id="user-role" aria-label="Role">
              <option value="Staff">Staff</option>
              <option value="Administrator">Administrator</option>
              <option value="Viewer">Viewer</option>
            </select>
            <select id="user-status" aria-label="Status">
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit">Save User</button>
            <button type="button" id="cancel-user" class="secondary-btn">Cancel</button>
          </div>
        </form>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
              <th>Last Login</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-table-body"></tbody>
        </table>
      </section>
    </main>
  </section>
  <script src="app.js"></script>
</body>
</html>
